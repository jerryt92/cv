                           style="border: solid 1px;border-radius: 5px;padding: 5px">

<script src="js/marked.umd.js"></script>
<script src="js/resume-markdown.js"></script>
<script src="js/crypto-js.min.js"></script>
<script src="js/aes.js"></script>
<script src="knowledge-qa/config.js"></script>
<script src="knowledge-qa/resume-ai.js"></script>
<script>
    var key = '';
    var qkey = getPramValue('qkey');

    function showLoading() {
        document.getElementById('verify-content').style.display = 'none';
        document.getElementById('loading-content').style.display = 'block';
    }

    function hideLoading() {
        document.getElementById('verify-content').style.display = 'block';
        document.getElementById('loading-content').style.display = 'none';
    }

    function showResume() {
        document.body.classList.remove('resume-locked');
        document.getElementById('verify-div').setAttribute('hidden', 'hidden');
        document.getElementById('pdf-btn').hidden = false;
        // 等简历 DOM 与头像完成一次布局后再挂载助手，避免 qkey 异步解密慢时面板参与锁定页布局。
        requestAnimationFrame(function () {
            requestAnimationFrame(function () {
                window.ResumeAi && window.ResumeAi.reveal();
            });
        });
    }

    async function loadImage(path) {
        try {
            const response = await fetch(path);
            if (!response.ok) {
                throw new Error('无法加载图片文件');
            }
            return await response.blob(); // 返回Blob对象
        } catch (error) {
            console.error(error);
            throw error; // 重新抛出错误以便调用者可以捕获
        }
    }

    // 从文件加载 headText 内容
    async function loadHeadText() {
        try {
            const response = await fetch('./assets/head-text.txt');
            if (!response.ok) {
                throw new Error('无法加载 headText 文件');
            }
            const text = await response.text();
            return text;
        } catch (error) {
            console.error(error);
            throw error;
        }
    }

    // 从文件加载 mainText 内容
    async function loadMainText() {
        try {
            const response = await fetch('./assets/main-text.txt');
            if (!response.ok) {
                throw new Error('无法加载 mainText 文件');
            }
            const text = await response.text();
            return text;
        } catch (error) {
            console.error(error);
            throw error;
        }
    }

    window.onload = async function () {
        if (sessionStorage.getItem('pwd')) {
            document.getElementById('key').value = sessionStorage.getItem('pwd');
            await verify();
        } else if (qkey != null) {
            showLoading();
            try {
                // 把qkey解密为key
                key = aesDecrypt('' + CryptoJS.MD5("20221001"), qkey);
                // 解锁头像
                avatarDecryptToCSS(key, 'avatar');
                // 解锁head-text
                const headText = await loadHeadText();
                renderResumeContent(aesDecrypt('' + CryptoJS.MD5(key), headText), document.getElementById('head-text'), 'head');
                // 解锁main-text
                const mainText = await loadMainText();
                renderResumeContent(aesDecrypt('' + CryptoJS.MD5(key), mainText), document.getElementById('main-text'), 'main');
                showResume();
            } catch (e) {
                hideLoading();
                document.getElementById('pdf-btn').hidden = true;
                alert('qkey参数错误！');
            }
        }
    }

    async function verify() {
        key = document.getElementById('key').value;
        showLoading();
        try {
            // 解锁头像
            avatarDecryptToCSS(key, 'avatar');
            // 解锁head-text
            const headText = await loadHeadText();
            renderResumeContent(aesDecrypt('' + CryptoJS.MD5(key), headText), document.getElementById('head-text'), 'head');
            // 解锁main-text
            const mainText = await loadMainText();
            renderResumeContent(aesDecrypt('' + CryptoJS.MD5(key), mainText), document.getElementById('main-text'), 'main');
            showResume();
            sessionStorage.setItem('pwd', key);
        } catch (e) {
            hideLoading();
            document.getElementById('pdf-btn').hidden = true;
            alert('密码错误！');
            sessionStorage.clear();
            location.reload();
        }
    }

    async function avatarDecryptToCSS(key, img_id) {
        try {
            // 加载加密的图片文件
            const blob = await loadImage('./assets/img/avatar_672_672.webp.aes256.bin');
            // 读取文件为ArrayBuffer
            const arrayBuffer = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsArrayBuffer(blob);
            });
            // 解密数据
            const decData = aesFileDecrypt('' + CryptoJS.MD5(key), arrayBuffer);
            // 创建Blob对象
            const fileBlob = new Blob([decData], {type: "image/webp"}); // 注意根据实际情况调整MIME类型
            // 构建URL并设置样式
            var csstext = 'background-image: url(' + URL.createObjectURL(fileBlob) + ');';
            document.getElementById(img_id).style.cssText += csstext;
        } catch (error) {
            console.error('图片解密失败:', error);
        }
    }

    function getPramValue(pramName) {
        var query = decodeURI(window.location.search.substring(1));
        var vars = query.split("&");
        for (var i = 0; i < vars.length; i++) {
            var pair = vars[i].split("=");
            if (pair[0] == pramName) {
                return pair[1].trim();
            }
        }
        return null;
    }

    document.addEventListener("DOMContentLoaded", function () {
        const passwordInput = document.getElementById('key');
        document.getElementById('pdf-btn').addEventListener('click', function () {
            window.print();
        });
        passwordInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                verify();
            }
        });
    });

    function handleKeyPress(event) {
        if (event.key === 'Enter') { // 使用 `event.key` 更直观
            verify(); // 调用验证函数
        }
    }
</script>
